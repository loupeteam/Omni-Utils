[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-bridge"
version = "0.1.0.dev0"
description = "Vendor-neutral PLC polling runtime and driver contract, with no Omniverse dependency"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Loupe", email = "info@loupe.team" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["PLC", "Beckhoff", "B&R", "digital twin"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/loupeteam/Omni-Utils"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
