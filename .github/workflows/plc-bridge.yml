# CI for the plain-Python plc_bridge package (plc_bridge/).
#
# Every push and pull request: pytest on the oldest and newest supported Python,
# then a wheel built and kept as a workflow artifact. A tag `plc-bridge-v<version>`
# also publishes that wheel to PyPI, but only when the PYPI_TOKEN secret exists;
# without it the publish job reports that it skipped and the workflow stays green.

name: plc-bridge

on:
  push:
    branches: ["**"]
    tags: ["plc-bridge-v*"]
    paths:
      - "plc_bridge/**"
      - ".github/workflows/plc-bridge.yml"
  pull_request:
    paths:
      - "plc_bridge/**"
      - ".github/workflows/plc-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install "./plc_bridge[test]"
      - name: Test
        run: python -m pytest plc_bridge

  build:
    name: wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build --outdir dist plc_bridge
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/plc-bridge-v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('plc_bridge/pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#plc-bridge-v}"
          if [ "$version" != "$tag" ]; then
            echo "tag plc-bridge-v$tag does not match pyproject version $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plc-bridge-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plc-bridge-v')
    runs-on: ubuntu-latest
    env:
      # The secrets context is not available in a job-level `if`, so the job runs
      # and its steps decide. Absent token: the job logs a notice and skips.
      HAS_TOKEN: ${{ secrets.PYPI_TOKEN != '' }}
    steps:
      - name: No PYPI_TOKEN secret, skipping publish
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::PYPI_TOKEN is not set; the wheel is in the workflow artifacts only."
      - uses: actions/download-artifact@v4
        if: env.HAS_TOKEN == 'true'
        with:
          name: plc-bridge-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: env.HAS_TOKEN == 'true'
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist
